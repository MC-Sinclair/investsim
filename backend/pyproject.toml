[project]
name = "investsim"
version = "0.1.0"
description = "Agente de inversion simulada - nucleo de dominio"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["investsim*"]
